{
  "pccs_url": "https://localhost:8081/sgx/certification/v3/", // The URL of the PCCS service, used to access the SGX certification service
  "use_secure_cert": true, // Whether to use a secure certificate for communication. If set to true, the client will verify the SSL/TLS certificate of the PCCS service
  "retry_times": 6, // The number of times to retry if the request to the PCCS service fails
  "retry_delay": 10, // The delay time between each retry (in seconds)
  "pck_cache_expire_hours": 168 // The expiration time for the PCK (Platform Certificate Key) cache (in hours). After this time, the cached PCK will expire and need to be reacquired
}
