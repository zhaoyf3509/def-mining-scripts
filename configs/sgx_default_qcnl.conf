{
  "pccs_url": "https://localhost:8081/sgx/certification/v3/", // PCCS 服务的 URL 地址，用于访问 SGX 认证服务
  "use_secure_cert": true, // 是否使用安全证书进行通信。如果设置为 true，则需要确保 PCCS 服务使用有效的 SSL/TLS 证书
  "retry_times": 6, // 在请求 PCCS 服务失败时，尝试重试的次数
  "retry_delay": 10, // 每次重试之间的延迟时间（单位：秒）
  "pck_cache_expire_hours": 168 // PCK（Platform Certificate Key）缓存的过期时间（单位：小时）。超过这个时间后，缓存的 PCK 将失效，需要重新获取
}
